# assert-role-arn — Composite action.
#
# Pre-flight assertion for the legacy `vars.AWS_ROLE_ARN_<ENV>` repo
# variables. Originally used by the reference consumer-pipeline template
# to fail fast when a per-env suffix variable was missing.
#
# DEPRECATED 2026-05-27 (ADR-056 M7 / D1, healthcare-iac#1288).
# The reference template no longer calls this action — the bot now
# writes env-scoped `vars.AWS_ROLE_ARN` (no suffix) to each GitHub
# Environment on /bind, so a missing variable surfaces as an env-scope
# resolution error in configure-aws-credentials itself, with no
# pre-flight indirection needed.
#
# This action is kept for backward compat — any customer who copied the
# pre-D1 template can still use it. Will be removed in a follow-up after
# the existing customer base has migrated.
#
# F58 part 3.
---
name: "Assert role ARN (DEPRECATED — see ADR-056 M7 / D1)"
description: >
  [DEPRECATED 2026-05-27 — healthcare-iac#1288]
  Pre-flight check that the legacy suffix-form `AWS_ROLE_ARN_<ENV>` is
  set and looks like an IAM role ARN. Superseded by env-scoped
  `vars.AWS_ROLE_ARN` in the post-D1 reference template; new
  workflows should not call this action.

inputs:
  env:
    required: true
    description: "Target environment: dev | staging | prod"
  role-arn:
    required: true
    # NOTE: avoid ${{ ... }} syntax in description fields — the runner
    # evaluates expressions even in metadata and rejects context refs
    # not valid in composite-action scope (e.g., vars.*, secrets.*).
    # Surfaced during F58-pt3 rollout; see issue #3 for the broader
    # manifest-lint kaizen.
    description: >
      The role-ARN value to assert. In a customer workflow the caller
      typically passes the corresponding repo variable for the target
      environment — e.g., the value of `vars.AWS_ROLE_ARN_DEV` for `dev`,
      `vars.AWS_ROLE_ARN_STAGING` for `staging`, etc.

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        ENV: ${{ inputs.env }}
        ROLE_ARN: ${{ inputs.role-arn }}
      run: |
        set -euo pipefail
        # shellcheck source=lib/assert-role-arn.sh
        source "${{ github.action_path }}/lib/assert-role-arn.sh"
        assert_role_arn "$ENV" "$ROLE_ARN"
