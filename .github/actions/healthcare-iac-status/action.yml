# healthcare-iac-status — Composite GitHub Action
#
# Checks infrastructure readiness for a customer's contract.
# Used by consumer repos (e.g., healthcare-platform) to gate
# deployments on infrastructure provisioning status.
#
# Reference: ADR-35 Section 7 (healthcare-iac-status GitHub Action)
---
name: "Healthcare IAC Status"
description: >
  Check infrastructure readiness for a customer's contract.
  Validates the contract schema, queries healthcare-iac for open
  contract-sync issues, and reports provisioning status.

inputs:
  customer-code:
    required: true
    description: "Customer short code (e.g., tsc0)"
  contract-path:
    required: true
    default: "infra-contract.yaml"
    description: "Path to infra-contract YAML (relative to repo root)"
  environment:
    required: true
    description: "Target environment: dev | staging | prod"
  iac-repo:
    required: false
    default: "TheSmallCompany/healthcare-iac"
    description: >
      [DEPRECATED — kept for backward compat] Iac repo coordinates.
      R23 moved cross-repo lookups server-side; this input is ignored.
  status-endpoint-url:
    required: false
    default: "https://16jrm9z2m0.execute-api.us-east-1.amazonaws.com/status"
    description: >
      URL of the maintainer-side status endpoint (R23). Override only
      for testing. Calls require a GitHub Actions OIDC JWT, which is
      requested at runtime — the calling workflow must grant
      `permissions: id-token: write`.
  audience:
    required: false
    default: "healthcare-iac-status"
    description: >
      Audience claim minted into the OIDC JWT and validated by the
      status endpoint's EXPECTED_AUDIENCE. NON-URL BY DESIGN — GitHub
      OIDC's anti-impersonation rule rejects URL-shaped audiences that
      name a foreign org (cause of F73). Do not "fix" this back to a
      URL. If you change it, change the endpoint's EXPECTED_AUDIENCE
      to match.
  # ── ADR-47 P6 / D9 — sleep-state read inputs ────────────────────────
  # Both optional so existing callers (no sleep-state interest) still
  # work; when omitted the `sleep-state` output is `unknown`.
  aws-role-arn:
    required: false
    default: ""
    description: >
      ARN of the consumer's OIDC role for the target environment. When
      set, the action assumes this role and reads
      /healthcare/<environment>/sleep-state from SSM. When empty, the
      action skips the AWS call and emits `sleep-state=unknown`.
  aws-region:
    required: false
    default: "us-east-1"
    description: "AWS region containing the sleep-state SSM parameter"

outputs:
  status:
    description: "ready | blocked | unknown (R23: provisioning collapsed into blocked)"
    value: ${{ steps.evaluate.outputs.status }}
  contract-version:
    description: "Contract version validated"
    value: ${{ steps.parse.outputs.contract-version }}
  resources-ready:
    description: "Count of provisioned resources"
    value: ${{ steps.evaluate.outputs.resources-ready }}
  resources-pending:
    description: "Count of pending resources"
    value: ${{ steps.evaluate.outputs.resources-pending }}
  blocking-issues:
    description: "JSON array of blocking issue URLs"
    value: ${{ steps.evaluate.outputs.blocking-issues }}
  details:
    description: "Full JSON validation details"
    value: ${{ steps.evaluate.outputs.details }}
  sleep-state:
    description: >
      Current sleep state of the target (customer, environment): one of
      awake | light-sleep | deep-sleep | unknown. ADR-47 P6 / D9.
      Reference workflow gates pushes on this — `deep-sleep` should
      fail-fast (see https://github.com/TheSmallCompany/healthcare-iac-onboarding/blob/main/templates/consumer-pipeline/build-and-promote.yml).
    value: ${{ steps.sleep-state.outputs.sleep-state }}

runs:
  using: "composite"
  steps:
    # ── Step 1: Validate inputs ──────────────────────────────────────
    # F58. customer-code must match infra-contracts' regex BEFORE we
    # mint a JWT or build a status-endpoint URL. Without this, an
    # unsubstituted Go template like '{{ .CustomerCode }}' (FI #3)
    # silently became part of the URL, returned HTTP 000, and got
    # blamed on "endpoint unreachable". Now it fails loud at the
    # action boundary with the value + regex in the error message.
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        CUSTOMER_CODE: ${{ inputs.customer-code }}
      run: |
        set -euo pipefail
        # shellcheck source=lib/validate-customer-code.sh
        source "${{ github.action_path }}/lib/validate-customer-code.sh"
        validate_customer_code "$CUSTOMER_CODE"

    # ── Step 2: Parse contract YAML ──────────────────────────────────
    - name: Parse contract YAML
      id: parse
      shell: bash
      run: |
        set -euo pipefail

        CONTRACT_PATH="${{ inputs.contract-path }}"

        if [[ ! -f "$CONTRACT_PATH" ]]; then
          echo "::error::Contract file not found: $CONTRACT_PATH"
          echo "parse-error=Contract file not found: $CONTRACT_PATH" >> "$GITHUB_OUTPUT"
          echo "contract-version=unknown" >> "$GITHUB_OUTPUT"
          echo "contract-customer=unknown" >> "$GITHUB_OUTPUT"
          echo "contract-valid=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Extract version, customer, region, slice using node inline
        PARSED=$(node -e "
          const fs = require('fs');
          const content = fs.readFileSync('$CONTRACT_PATH', 'utf-8');
          // Simple YAML field extraction (no dependency on js-yaml)
          const getField = (key) => {
            const match = content.match(new RegExp('^' + key + ':\\\\s*[\"\\']?([^\"\\'\\n]+)[\"\\']?', 'm'));
            return match ? match[1].trim() : '';
          };
          const version = getField('version');
          const customer = getField('customer');
          const region = getField('region');
          const slice = getField('slice');
          console.log(JSON.stringify({ version, customer, region, slice }));
        ")

        VERSION=$(echo "$PARSED" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.version)")
        CUSTOMER=$(echo "$PARSED" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.customer)")
        REGION=$(echo "$PARSED" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.region)")
        SLICE=$(echo "$PARSED" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8')); console.log(d.slice)")

        echo "contract-version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "contract-customer=${CUSTOMER}" >> "$GITHUB_OUTPUT"
        echo "contract-region=${REGION}" >> "$GITHUB_OUTPUT"
        echo "contract-slice=${SLICE}" >> "$GITHUB_OUTPUT"

        # Validate required fields
        ERRORS=""
        if [[ -z "$VERSION" ]]; then
          ERRORS="${ERRORS}Missing required field: version. "
        fi
        if [[ -z "$REGION" ]]; then
          ERRORS="${ERRORS}Missing required field: region. "
        fi
        if [[ -z "$SLICE" ]]; then
          ERRORS="${ERRORS}Missing required field: slice. "
        fi

        if [[ -n "$ERRORS" ]]; then
          echo "::warning::Contract schema validation: $ERRORS"
          echo "contract-valid=false" >> "$GITHUB_OUTPUT"
          echo "parse-error=${ERRORS}" >> "$GITHUB_OUTPUT"
        else
          echo "contract-valid=true" >> "$GITHUB_OUTPUT"
          echo "parse-error=" >> "$GITHUB_OUTPUT"
        fi

        # Verify customer code matches if contract has a customer field
        if [[ -n "$CUSTOMER" && "$CUSTOMER" != "${{ inputs.customer-code }}" ]]; then
          echo "::warning::Contract customer '$CUSTOMER' does not match input customer-code '${{ inputs.customer-code }}'"
        fi

    # ── Step 3: Count contract resources ─────────────────────────────
    - name: Count contract resources
      id: count
      shell: bash
      run: |
        set -euo pipefail

        CONTRACT_PATH="${{ inputs.contract-path }}"

        if [[ ! -f "$CONTRACT_PATH" ]]; then
          echo "total-resources=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Count resources using pattern matching on the contract YAML
        # Each section contributes resources differently
        TOTAL=0

        # ECR repositories (count items under repositories:)
        ECR_COUNT=$(grep -c '^\s*- name:' "$CONTRACT_PATH" 2>/dev/null | head -1 || echo "0")

        # Databases (count items with "- id:" under databases section)
        DB_COUNT=$(node -e "
          const fs = require('fs');
          const content = fs.readFileSync('$CONTRACT_PATH', 'utf-8');
          // Count sections that have array items
          const sections = ['databases', 'caches', 'iam_roles', 'secrets', 'config_maps'];
          let total = 0;
          for (const section of sections) {
            const regex = new RegExp('^' + section + ':', 'm');
            if (regex.test(content)) {
              // Count array items (lines matching '  - id:' or '  - name:')
              const sectionMatch = content.match(new RegExp(section + ':[\\\\s\\\\S]*?(?=^[a-z_]+:|$)', 'm'));
              if (sectionMatch) {
                const items = sectionMatch[0].match(/^\\s+- (id|name):/gm);
                total += items ? items.length : 0;
              }
            }
          }
          // Single-instance sections
          const singletons = ['eks_cluster', 'cognito', 'observability', 'cicd'];
          for (const section of singletons) {
            const regex = new RegExp('^' + section + ':', 'm');
            if (regex.test(content)) total++;
          }
          // ECR repositories
          const ecrMatch = content.match(/ecr_repositories:[\\s\\S]*?repositories:[\\s\\S]*?(?=^[a-z_]+:|$)/m);
          if (ecrMatch) {
            const repos = ecrMatch[0].match(/^\\s+- name:/gm);
            total += repos ? repos.length : 0;
          }
          console.log(total);
        ")

        echo "total-resources=${DB_COUNT}" >> "$GITHUB_OUTPUT"

    # ── Step 4: Query the R23 status endpoint ────────────────────────
    # Replaces the old "mint App token + gh issue list against private
    # healthcare-iac" flow (ADR-47 R23 / F59). Calls a maintainer-owned
    # HTTPS endpoint that performs the cross-repo lookup server-side
    # using its own credentials. We authenticate by minting a GitHub
    # Actions OIDC JWT — requires `permissions: id-token: write` in the
    # caller workflow.
    #
    # F74: JWT mint is delegated to lib/mint-oidc-jwt.sh, which exits
    # non-zero with a specific ::error:: line for each of four failure
    # modes (env-vars missing, curl network fail, non-200 from GitHub
    # OIDC, response not JSON). `set -e` propagates that exit so the
    # step fails loud — no more silent "Status will be 'unknown'" when
    # the real cause is a missing id-token: write permission.
    - name: Query status endpoint (R23)
      id: query-status
      shell: bash
      env:
        STATUS_URL: ${{ inputs.status-endpoint-url }}
        CUSTOMER_CODE: ${{ inputs.customer-code }}
      run: |
        set -euo pipefail

        OWNER="${GITHUB_REPOSITORY_OWNER}"
        REPO="${GITHUB_REPOSITORY##*/}"
        AUD="${{ inputs.audience }}"

        # F74: mint via the helper. Exits 1 with diagnostic ::error::
        # if anything is wrong on the mint side.
        # shellcheck source=lib/mint-oidc-jwt.sh
        source "${{ github.action_path }}/lib/mint-oidc-jwt.sh"
        JWT=$(mint_oidc_jwt "$AUD")

        # Call the status endpoint. Body to file, %{http_code} to stdout.
        BODY_FILE=$(mktemp)
        HTTP_CODE=$(curl -sSL \
          -w "%{http_code}" \
          -o "${BODY_FILE}" \
          "${STATUS_URL}?customer_code=${CUSTOMER_CODE}&owner=${OWNER}&repo=${REPO}" \
          -H "Authorization: Bearer ${JWT}" || echo "000")
        BODY=$(cat "${BODY_FILE}")
        rm -f "${BODY_FILE}"

        echo "::notice::Status endpoint returned HTTP ${HTTP_CODE}"

        if [ "${HTTP_CODE}" = "200" ]; then
          STATUS=$(echo "${BODY}" | jq -r '.status // "unknown"')
          ISSUES=$(echo "${BODY}" | jq -c '.blocking_issues // []')
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"
          echo "blocking-issues=${ISSUES}" >> "${GITHUB_OUTPUT}"
        elif [ "${HTTP_CODE}" = "401" ] || [ "${HTTP_CODE}" = "403" ] || [ "${HTTP_CODE}" = "404" ]; then
          REASON=$(echo "${BODY}" | jq -r '.reason // "no reason"' 2>/dev/null || echo "no reason")
          echo "::error::Status endpoint denied request (HTTP ${HTTP_CODE}): ${REASON}"
          echo "status=blocked" >> "${GITHUB_OUTPUT}"
          echo "blocking-issues=[]" >> "${GITHUB_OUTPUT}"
        else
          # 5xx or network — fail-open to unknown so a transient endpoint
          # outage doesn't take down every customer pipeline simultaneously.
          echo "::warning::Status endpoint returned ${HTTP_CODE}. Fail-open to 'unknown'."
          echo "status=unknown" >> "${GITHUB_OUTPUT}"
          echo "blocking-issues=[]" >> "${GITHUB_OUTPUT}"
        fi

    # ── Step 4.5: Configure AWS credentials for sleep-state read ─────
    # ADR-47 P6 / D9. Skipped when aws-role-arn is empty — that's the
    # opt-out path for callers who don't care about sleep state. The
    # `if` keeps the action backward-compatible.
    - name: Configure AWS credentials for sleep-state
      id: aws-creds
      if: ${{ inputs.aws-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: healthcare-iac-status-sleep-read

    # ── Step 4.6: Read sleep-state from SSM ──────────────────────────
    # Fail-open: on any error (no role configured, param missing,
    # API failure, malformed value) we emit `unknown` and let the
    # caller's reference workflow decide what to do. Per D9, the
    # primary readiness gate is `status`; this is a defense-in-depth
    # signal so consumer pushes don't silently fall into a void
    # during deep-sleep.
    - name: Read sleep-state SSM parameter
      id: sleep-state
      shell: bash
      env:
        AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        AWS_REGION_INPUT: ${{ inputs.aws-region }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
      run: |
        set +e
        # Sourced helper — same logic, bats-tested in lib/read-sleep-state.sh.
        # shellcheck source=lib/read-sleep-state.sh
        source "${{ github.action_path }}/lib/read-sleep-state.sh"
        VALUE=$(read_sleep_state "$AWS_ROLE_ARN" "$ENVIRONMENT_INPUT" "$AWS_REGION_INPUT")
        echo "sleep-state=$VALUE" >> "$GITHUB_OUTPUT"

    # ── Step 5: Evaluate overall status ──────────────────────────────
    # Composes contract-validity (local) with endpoint-status (remote).
    # Contract failures always win — a malformed contract blocks before
    # we even ask the endpoint about it.
    - name: Evaluate status
      id: evaluate
      shell: bash
      run: |
        set -euo pipefail

        CONTRACT_VALID="${{ steps.parse.outputs.contract-valid }}"
        PARSE_ERROR="${{ steps.parse.outputs.parse-error }}"
        TOTAL_RESOURCES="${{ steps.count.outputs.total-resources }}"
        ENDPOINT_STATUS="${{ steps.query-status.outputs.status }}"
        ENDPOINT_ISSUES='${{ steps.query-status.outputs.blocking-issues }}'

        STATUS="unknown"
        RESOURCES_READY=0
        RESOURCES_PENDING=0
        BLOCKING_ISSUES="[]"
        DETAILS="{}"

        if [[ "$CONTRACT_VALID" != "true" ]]; then
          STATUS="blocked"
          RESOURCES_PENDING="$TOTAL_RESOURCES"
          DETAILS="{\"error\":\"Contract validation failed\",\"parse_error\":\"${PARSE_ERROR}\"}"
        elif [[ "$ENDPOINT_STATUS" == "ready" ]]; then
          STATUS="ready"
          RESOURCES_READY="$TOTAL_RESOURCES"
          DETAILS="{\"contract_valid\":true,\"endpoint_status\":\"ready\"}"
        elif [[ "$ENDPOINT_STATUS" == "blocked" ]]; then
          STATUS="blocked"
          RESOURCES_PENDING="$TOTAL_RESOURCES"
          BLOCKING_ISSUES="$ENDPOINT_ISSUES"
          DETAILS="{\"contract_valid\":true,\"endpoint_status\":\"blocked\",\"blocking_issues\":${ENDPOINT_ISSUES}}"
        else
          # ENDPOINT_STATUS is "unknown" (or empty/unexpected) — fail-open
          STATUS="unknown"
          RESOURCES_PENDING="$TOTAL_RESOURCES"
          DETAILS="{\"contract_valid\":true,\"endpoint_status\":\"${ENDPOINT_STATUS:-empty}\"}"
        fi

        echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
        echo "resources-ready=${RESOURCES_READY}" >> "$GITHUB_OUTPUT"
        echo "resources-pending=${RESOURCES_PENDING}" >> "$GITHUB_OUTPUT"
        echo "blocking-issues=${BLOCKING_ISSUES}" >> "$GITHUB_OUTPUT"
        echo "details=${DETAILS}" >> "$GITHUB_OUTPUT"

    # ── Step 6: Write summary ────────────────────────────────────────
    - name: Write summary
      shell: bash
      run: |
        STATUS="${{ steps.evaluate.outputs.status }}"
        VERSION="${{ steps.parse.outputs.contract-version }}"
        CUSTOMER="${{ inputs.customer-code }}"
        ENV="${{ inputs.environment }}"
        READY="${{ steps.evaluate.outputs.resources-ready }}"
        PENDING="${{ steps.evaluate.outputs.resources-pending }}"

        # Status emoji
        case "$STATUS" in
          ready) EMOJI="✅" ;;
          blocked) EMOJI="🚫" ;;
          *) EMOJI="❓" ;;
        esac

        cat >> "$GITHUB_STEP_SUMMARY" << EOF
        ## ${EMOJI} Infrastructure Status: ${STATUS}

        | Field | Value |
        |-------|-------|
        | Customer | \`${CUSTOMER}\` |
        | Environment | \`${ENV}\` |
        | Contract Version | \`${VERSION}\` |
        | Resources Ready | ${READY} |
        | Resources Pending | ${PENDING} |
        | Status | **${STATUS}** |
        EOF

        if [[ "$STATUS" == "blocked" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Blocking Issues" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.evaluate.outputs.blocking-issues }}' | node -e "
            const issues = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf-8'));
            if (Array.isArray(issues)) issues.forEach(url => console.log('- ' + url));
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        fi
