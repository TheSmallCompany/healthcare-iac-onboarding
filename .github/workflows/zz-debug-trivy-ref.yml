name: zz-debug-trivy-ref
on: [pull_request]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe how the runner token sees aquasecurity/trivy-action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for path in \
            "repos/aquasecurity/trivy-action" \
            "repos/aquasecurity/trivy-action/git/refs/tags/v0.36.0" \
            "repos/aquasecurity/trivy-action/commits/v0.36.0" \
            "repos/sigstore/cosign-installer" ; do
            echo "=== gh api $path ==="
            gh api "$path" 2>&1 | head -5
            echo "   gh-exit=$?"
            echo "--- anonymous curl ---"
            curl -s -o /dev/null -w '   http=%{http_code}\n' "https://api.github.com/$path"
          done
          echo "=== rate limit as seen by the runner token ==="
          gh api rate_limit 2>&1 | head -20
