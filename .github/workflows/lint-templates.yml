# Lint customer-facing workflow templates (F-ecr-login-pin / kaizen).
#
# Two jobs:
#   actionlint     — static lint for syntax/expression/step-ref/typos
#                    (rhysd/actionlint). Doesn't validate that
#                    `uses: owner/repo@ref` resolves over the network —
#                    that's resolve-pins' job.
#   resolve-pins   — for each `uses:` in templates/, calls the GitHub API
#                    to confirm the ref exists as a tag, branch, or
#                    commit. Catches the F-ecr-login class (template
#                    ships pinning a non-existent version).
name: Lint templates

on:
  pull_request:
    paths:
      - 'templates/**'
      - '.github/workflows/lint-templates.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.github/workflows/lint-templates.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
      - name: Run actionlint on templates
        run: ./actionlint -no-color -oneline templates/consumer-pipeline/*.yml

  resolve-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each `uses:` in templates/ resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          checked=0
          while IFS= read -r raw; do
            file="${raw%%:*}"
            rest="${raw#*:}"
            line="${rest%%:*}"
            text="${rest#*:}"
            ref=$(echo "$text" | sed -nE 's/[[:space:]]*-?[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p')
            [ -z "$ref" ] && continue
            # Skip local actions (./..., ../...) — resolved at runtime by checkout state.
            case "$ref" in
              .*) continue ;;
              # Skip our own published action — don't gate ourselves.
              TheSmallCompany/healthcare-iac-onboarding/*) continue ;;
            esac
            checked=$((checked + 1))
            owner_repo="${ref%@*}"
            rev="${ref#*@}"

            # Resolution is attempted with credentials first, then ANONYMOUSLY.
            #
            # An organization with an IP allow list rejects *credentialed* reads
            # of its resources from IPs outside that list — including
            # GitHub-hosted runner IPs, and including its PUBLIC repositories.
            # Observed 2026-09-11 for `aquasecurity`: from a runner,
            #   authenticated -> 403 "the `aquasecurity` organization has an IP
            #                         allow list enabled"
            #   anonymous     -> 200
            # while the same authenticated call from a laptop returns 200.
            #
            # Without the anonymous fallback this lint reports "ref does not
            # resolve" for a perfectly valid pin — a failure message that names
            # the wrong cause and sends the reader looking for a typo in a tag
            # that exists. `uses:` resolution at runtime does not go through
            # this API at all, so the pipeline itself is unaffected.
            resolved=""
            for kind_path in "tag:git/refs/tags/$rev" "branch:git/refs/heads/$rev" "commit:commits/$rev"; do
              kind="${kind_path%%:*}"
              path="${kind_path#*:}"
              if gh api "repos/$owner_repo/$path" >/dev/null 2>&1; then
                resolved="$kind"
                break
              fi
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                       "https://api.github.com/repos/$owner_repo/$path" 2>/dev/null || echo 000)
              if [ "$code" = "200" ]; then
                resolved="$kind (anon — credentialed probe blocked by an org IP allow list)"
                break
              fi
              if [ "$code" = "429" ]; then
                echo "UNDETERMINED anonymous API rate limit hit while checking $ref ($file:$line)"
                echo "             This is not a verdict on the ref. Re-run the job."
                resolved="undetermined"
                fail=1
                break
              fi
            done

            if [ -z "$resolved" ]; then
              echo "FAIL ref does not resolve: $ref ($file:$line)"
              fail=1
            elif [ "$resolved" != "undetermined" ]; then
              echo "OK   $resolved $ref ($file:$line)"
            fi
          done < <(grep -rn -E '^[[:space:]]*-?[[:space:]]*uses:' templates/ --include='*.yml' --include='*.yaml' --include='*.example' || true)
          echo "---"
          echo "Checked $checked ref(s) across templates/"
          exit $fail

      # Strict-version pin verification — for actions where staying on
      # the published-major matters (Node 20 deprecation, security
      # advisories, breaking-change cadence), pin the EXACT major and
      # fail the lint if the template drifts behind.
      #
      # Currently enforced:
      #   aws-actions/configure-aws-credentials@v6
      #     — v5 hits Node 16 deprecation (deadline 2026-09-16).
      #     Customer pipelines copying the template should land on
      #     a Node 20-supported version from day one.
      - name: Strict-version pin verification
        run: |
          set -euo pipefail
          fail=0
          # action_name | required_pin | rationale
          declare -a ENFORCED=(
            "aws-actions/configure-aws-credentials|@v6|Node 20 deprecation; v5 expires 2026-09-16"
          )
          for entry in "${ENFORCED[@]}"; do
            IFS='|' read -r action required reason <<< "$entry"
            while IFS= read -r line; do
              # Extract just the @ref from a uses: line that mentions this action
              ref=$(echo "$line" | sed -nE "s|.*uses:[[:space:]]*${action}(@[^[:space:]#]+).*|\1|p")
              [ -z "$ref" ] && continue
              if [ "$ref" != "$required" ]; then
                echo "FAIL ${action}${ref} must be ${action}${required} (${reason})"
                fail=1
              else
                echo "OK   ${action}${ref}"
              fi
            done < <(grep -rn -E "uses:[[:space:]]*${action}@" templates/ --include='*.yml' --include='*.yaml' --include='*.example' || true)
          done
          exit $fail
