#
# Reference consumer-pipeline workflow (ADR-47).
#
# Copy this file into your application repository at
# .github/workflows/build-and-promote.yml. Replace the placeholders
# (between {{ }}) with the values the healthcare-iac maintainer posts on
# your onboarding issue. After that, this is YOUR pipeline — modify it as
# your application evolves.
#
# What it does (pull-deploy model — the default):
#   1. Read ecr_repositories.repositories[] from your infra-contract.yaml
#      and build each declared service in a GHA matrix (resolve-services
#      job). Single-image consumers (one repository entry, no `build:`
#      block) get a single-element matrix automatically — no special-case
#      configuration required.
#   2. Build each container image (matrix.service.dockerfile,
#      matrix.service.context).
#   3. Sign each image with cosign keyless (Sigstore).
#   4. Push each image to its customer-scoped ECR repository in the dev
#      account.
#   5. Open an overlay-bump PR in healthcare-iac/deploy/overlays/dev/
#      (auto-merged for dev). ArgoCD reconciles the new images.
#   6. On `staging` Environment dispatch: re-sign + push to staging ECR,
#      open an overlay-bump PR for staging (gated by Environment
#      reviewers).
#   7. On `prod` Environment dispatch: re-sign + push to prod ECR, open
#      an overlay-bump PR for prod (gated by Environment reviewers).
#
# Why contract-driven matrix (ADR-47 P7b item 9, iac#1299):
#   The service list already lives in your infra-contract.yaml under
#   ecr_repositories.repositories[]. Reading from there means single-
#   image and multi-image consumers use the same workflow without forks,
#   and per-service Dockerfile/context can live with the rest of the
#   contract (under optional `build:` blocks). The resolve-services job
#   reads the contract via yq and emits matrix JSON; downstream jobs
#   consume it via fromJSON(needs.resolve-services.outputs.matrix).
#
# Why scoped role ARN variables: your repo doesn't see the prod ARN
# unless your job is gated by the prod Environment, defending against a
# compromised dev workflow leaking the prod role.
#

name: build-and-promote

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Promote to: staging | prod"
        required: true
        type: choice
        options: [staging, prod]
  # ADR-47 §D2 (iac#1290) — bot-driven re-fire after a contract-sync
  # PR merges. The consumer-onboarding bot POSTs repository_dispatch
  # with this event_type because GitHub suppresses push triggers on
  # App-authored merges (anti-recursion). This subscription lets the
  # build job fire automatically when the customer's contract syncs.
  # The build job's `if:` condition treats this event identically to
  # push — same dev-build path.
  repository_dispatch:
    types: [healthcare-iac-contract-sync]

permissions:
  contents: read
  id-token: write # required for AWS OIDC federation
  pull-requests: write # required to open overlay-bump PRs

env:
  CUSTOMER_CODE: "{{ .CustomerCode }}"
  ECR_REPO_PREFIX: "{{ .EcrRepoPrefix }}"
  # IMAGE_NAME removed — per-service name comes from matrix.service.name,
  # which the resolve-services job derives from
  # ecr_repositories.repositories[].name in your infra-contract.yaml.

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Status gate — only build if healthcare-iac says "ready"
  # ───────────────────────────────────────────────────────────────────
  status:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      sleep_state: ${{ steps.check.outputs.sleep-state }}
    steps:
      - uses: actions/checkout@v6

      - id: check
        uses: TheSmallCompany/healthcare-iac-onboarding/.github/actions/healthcare-iac-status@main
        with:
          customer-code: "{{ .CustomerCode }}"
          contract-path: "infra-contract.yaml"
          environment: "dev"
          aws-role-arn: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Fail closed if not ready
        if: steps.check.outputs.status != 'ready'
        run: |
          echo "::error::healthcare-iac status is '${{ steps.check.outputs.status }}'; refusing to build."
          echo "See onboarding issue or run \`./scripts/verify-consumer-cicd.sh\` against your contract for diagnostics."
          exit 1

  # ───────────────────────────────────────────────────────────────────
  # Sleep-state gate (ADR-47 P6 / D9)
  # ───────────────────────────────────────────────────────────────────
  # Decides whether to proceed based on the target environment's
  # sleep-state. Without this gate, pushing to a deep-sleep environment
  # silently succeeds (image lands in ECR, no reconcile because EKS is
  # destroyed) and the work disappears until someone notices.
  #
  #   awake       → proceed
  #   light-sleep → warn + proceed (ArgoCD reconciles on wake)
  #   deep-sleep  → fail fast with the wake command
  #   unknown     → warn + proceed (defense-in-depth: status is the
  #                  primary gate; sleep-state is supplementary)
  #
  # Fail-fast on deep-sleep is enforced by iac#1316 lint
  # (scripts/lint-template-sleep-gate.sh) — see ADR-47 P7b item 8 for
  # the decision rationale (silent skip = anti-pattern; loud failure
  # surfaces stalled deploys via copy-pasteable wake command).
  sleep-gate:
    needs: status
    runs-on: ubuntu-latest
    steps:
      - name: Decide based on sleep-state
        env:
          SLEEP_STATE: ${{ needs.status.outputs.sleep_state }}
          CUSTOMER_CODE: "{{ .CustomerCode }}"
        run: |
          set -euo pipefail
          case "$SLEEP_STATE" in
            awake)
              echo "::notice::dev is awake — proceeding with build"
              ;;
            light-sleep)
              echo "::warning::dev is in light-sleep — build will proceed; ArgoCD will reconcile when the cluster wakes."
              ;;
            unknown)
              echo "::warning::sleep-state could not be determined (returned 'unknown') — proceeding without gate. Verify aws-role-arn input on the status step."
              ;;
            deep-sleep)
              echo "::error::dev is in deep-sleep — refusing to push because ArgoCD will not reconcile."
              echo ""
              echo "Wake before deploying:"
              echo "  Slack: /infra deep-wake ${CUSTOMER_CODE} dev"
              echo "  or: gh workflow run \"Dev Infrastructure Sleep/Wake\" \\"
              echo "        --field action=deep-wake \\"
              echo "        --field customer=${CUSTOMER_CODE} \\"
              echo "        --field environment=dev"
              exit 1
              ;;
            *)
              echo "::error::Unexpected sleep-state value '$SLEEP_STATE' — failing closed."
              exit 1
              ;;
          esac

  # ───────────────────────────────────────────────────────────────────
  # Resolve services — read the contract, emit matrix JSON
  # ───────────────────────────────────────────────────────────────────
  # Reads ecr_repositories.repositories[] from infra-contract.yaml and
  # emits a JSON array suitable for `strategy.matrix.service`. Each
  # element looks like:
  #
  #   { "name": "member-service",        # short name (after last /)
  #     "repo": "platform/member-service", # full repo path (matches ECR)
  #     "dockerfile": "Dockerfile",      # default if .build.dockerfile absent
  #     "context": "."                   # default if .build.context absent
  #   }
  #
  # Single-image consumers (one entry, no `build:` block) get a one-
  # element matrix automatically — no special-case logic. Multi-image
  # consumers declare per-service `build:` blocks per
  # docs/consumer-guide.md.
  #
  # Schema validation of the optional `build:` block is enforced
  # provider-side by check_ecr_repositories_block in
  # scripts/validate-infra-contract.py (iac#1317, PR α of item 9).
  resolve-services:
    needs: [status, sleep-gate]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Install yq
        uses: mikefarah/yq@master
      - id: read
        run: |
          set -euo pipefail
          MATRIX=$(yq -o=json -I=0 '[
            .ecr_repositories.repositories[]
            | {
                "name":       (.name | split("/") | .[-1]),
                "repo":       .name,
                "dockerfile": (.build.dockerfile // "Dockerfile"),
                "context":    (.build.context    // ".")
              }
          ]' infra-contract.yaml)
          echo "Resolved $(echo "$MATRIX" | jq 'length') service(s) from infra-contract.yaml"
          echo "$MATRIX" | jq .
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────
  # Dev — every main push pushes each service to dev ECR + auto-bumps
  # the dev overlay
  # ───────────────────────────────────────────────────────────────────
  build-dev:
    needs: [status, sleep-gate, resolve-services]
    # Fires on direct main pushes OR bot-driven repository_dispatch
    # (ADR-47 §D2 — bot's post-merge re-fire after a contract-sync PR
    # merges; GitHub's anti-recursion suppresses the equivalent push
    # trigger). Both paths drive the same dev build.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'repository_dispatch' && github.event.action == 'healthcare-iac-contract-sync')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: "Pre-flight: assert AWS_ROLE_ARN_DEV is set"
        uses: TheSmallCompany/healthcare-iac-onboarding/.github/actions/assert-role-arn@main
        with:
          env: dev
          role-arn: ${{ vars.AWS_ROLE_ARN_DEV }}

      - name: Configure AWS credentials (OIDC, dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (${{ matrix.service.name }})
        run: |
          docker build \
            -f "${{ matrix.service.dockerfile }}" \
            -t "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}" \
            "${{ matrix.service.context }}"

      # ── Shift-left image scan (iac#2396) ─────────────────────────────
      # Scans the image that was just built, BEFORE it is pushed. A HIGH or
      # CRITICAL vulnerability that has a fix available fails the job, so the
      # vulnerable artifact never reaches ECR at all.
      #
      # Threshold rationale — recorded deliberately per iac#2396 item 2:
      #
      #   severity: HIGH,CRITICAL
      #       Failing on every MEDIUM against a typical base image blocks all
      #       work; failing on nothing is theatre. Measured 2026-09-11 with
      #       these exact flags: `alpine:latest` 2 findings, `python:3.9-slim`
      #       58, `gcr.io/distroless/static-debian12:nonroot` 0 — the
      #       threshold discriminates.
      #
      #   ignore-unfixed: true
      #       A CVE with no upstream fix cannot be actioned by rebuilding.
      #       Amazon Inspector's continuous rescan keeps reporting those until
      #       a fix ships — that is its job, not this gate's (iac#2246).
      #
      #   exit-code: "1"
      #       WITHOUT this the action prints a findings table and ALWAYS
      #       succeeds. A scanner that cannot fail is worse than no scanner
      #       because it looks like coverage (iac#2389, iac#2041).
      #
      #   TRIVY_IMAGE_SRC: docker
      #       Trivy's default source order is docker,containerd,podman,remote.
      #       If the locally-built image were missing or mis-tagged, Trivy
      #       would SILENTLY pull the previous image from ECR and scan that
      #       instead — reporting clean while the new, unscanned image goes
      #       up. Pinning the source to `docker` turns that into a loud
      #       failure. Verified 2026-09-11: with TRIVY_IMAGE_SRC=docker and no
      #       daemon, Trivy exits FATAL "unable to find the specified image
      #       ... in [\"docker\"]" rather than falling back to the registry.
      #
      # Suppressing a finding: add it to `.trivyignore` at the root of YOUR
      # repo (Trivy reads that path by default) together with a matching
      # register entry, mirroring healthcare-iac's `.gitleaks.toml` →
      # docs/security/secrets-scan-exceptions.md pattern. See
      # docs/security/image-scan-exceptions.md for the entry format. Never
      # suppress by lowering `severity` or `exit-code` — that silently
      # disables the gate for every future finding, not just the one you
      # accepted.
      #
      # Structurally enforced by scripts/lint-template-image-scan.sh; the
      # threshold is proven capable of failing by scripts/verify-trivy-gate.sh.
      - name: Scan image (Trivy, ${{ matrix.service.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Never fall back to pulling from the registry — see rationale above.
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ github.sha }}"
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image (${{ matrix.service.name }})
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      - name: Sign image (Sigstore keyless, ${{ matrix.service.name }})
        run: |
          cosign sign --yes \
            "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      - name: Open overlay-bump PR (dev, ${{ matrix.service.name }})
        # Replace this with whatever overlay-bump tool you use. The
        # canonical implementation in healthcare-iac uses a small
        # GitHub App-authenticated job; consumers can also use
        # nested-action tools like `peter-evans/create-pull-request`.
        # Multi-service overlay layout (one folder per service) is
        # tracked under iac#1299 items 2+4.
        run: |
          echo "TODO: open PR against TheSmallCompany/healthcare-iac"
          echo "      bumping deploy/overlays/dev/${CUSTOMER_CODE}/${{ matrix.service.name }}/kustomization.yaml"
          echo "      to image tag ${GITHUB_SHA}"

  # ───────────────────────────────────────────────────────────────────
  # Staging — Environment-gated; sub-claim must include `environment:staging`
  # ───────────────────────────────────────────────────────────────────
  promote-staging:
    needs: [status, resolve-services]
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging'
    runs-on: ubuntu-latest
    environment: staging # Environment reviewers gate this
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: "Pre-flight: assert AWS_ROLE_ARN_STAGING is set"
        uses: TheSmallCompany/healthcare-iac-onboarding/.github/actions/assert-role-arn@main
        with:
          env: staging
          role-arn: ${{ vars.AWS_ROLE_ARN_STAGING }}

      - name: Configure AWS credentials (OIDC, staging)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Variable scoped to the staging Environment — defense in depth.
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Login to ECR (staging)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (staging, ${{ matrix.service.name }})
        run: |
          docker build \
            -f "${{ matrix.service.dockerfile }}" \
            -t "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}" \
            "${{ matrix.service.context }}"

      # Shift-left image scan — scans the built image before it is pushed.
      # Full threshold rationale on the build-dev job above (iac#2396). The
      # config MUST stay identical across dev/staging/prod: a prod gate weaker
      # than the dev gate is enforced against by
      # scripts/lint-template-image-scan.sh.
      - name: Scan image (Trivy, staging, ${{ matrix.service.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Never fall back to pulling from the registry — see rationale above.
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ github.sha }}"
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image (staging, ${{ matrix.service.name }})
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      # Sigstore keyless required for staging per ADR-47 §D8. The
      # signature's OIDC sub-claim includes `environment:staging`, which
      # the cluster's Kyverno verify-image policy pins.
      - name: Sign image (Sigstore keyless, staging, ${{ matrix.service.name }})
        run: |
          cosign sign --yes \
            "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      - name: Open overlay-bump PR (staging, ${{ matrix.service.name }})
        run: |
          echo "TODO: open PR against TheSmallCompany/healthcare-iac"
          echo "      bumping deploy/overlays/staging/${CUSTOMER_CODE}/${{ matrix.service.name }}/kustomization.yaml"

  # ───────────────────────────────────────────────────────────────────
  # Prod — Environment-gated; sub-claim must include `environment:prod`
  # ───────────────────────────────────────────────────────────────────
  promote-prod:
    needs: [status, resolve-services]
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod'
    runs-on: ubuntu-latest
    environment: prod # Environment reviewers gate this
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-services.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: "Pre-flight: assert AWS_ROLE_ARN_PROD is set"
        uses: TheSmallCompany/healthcare-iac-onboarding/.github/actions/assert-role-arn@main
        with:
          env: prod
          role-arn: ${{ vars.AWS_ROLE_ARN_PROD }}

      - name: Configure AWS credentials (OIDC, prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Variable scoped to the prod Environment — only this job sees it.
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Login to ECR (prod)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (prod, ${{ matrix.service.name }})
        run: |
          docker build \
            -f "${{ matrix.service.dockerfile }}" \
            -t "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}" \
            "${{ matrix.service.context }}"

      # Shift-left image scan — scans the built image before it is pushed.
      # Full threshold rationale on the build-dev job above (iac#2396). The
      # config MUST stay identical across dev/staging/prod: a prod gate weaker
      # than the dev gate is enforced against by
      # scripts/lint-template-image-scan.sh.
      - name: Scan image (Trivy, prod, ${{ matrix.service.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Never fall back to pulling from the registry — see rationale above.
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ github.sha }}"
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image (prod, ${{ matrix.service.name }})
        run: |
          docker push "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      # Sigstore keyless required for prod per ADR-47 §D8. The signature's
      # OIDC sub-claim includes `environment:prod`, which the cluster's
      # Kyverno verify-image policy pins — only signatures produced by
      # this exact prod-gated job satisfy admission.
      - name: Sign image (Sigstore keyless, prod, ${{ matrix.service.name }})
        run: |
          cosign sign --yes \
            "${{ steps.ecr.outputs.registry }}/${{ matrix.service.repo }}:${GITHUB_SHA}"

      - name: Open overlay-bump PR (prod, ${{ matrix.service.name }})
        run: |
          echo "TODO: open PR against TheSmallCompany/healthcare-iac"
          echo "      bumping deploy/overlays/prod/${CUSTOMER_CODE}/${{ matrix.service.name }}/kustomization.yaml"
